<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#176b3a">
<link rel="manifest" href="/manifest.json">
<title>Lecture Reminder</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f4;color:#17301f}
header{background:#176b3a;color:#fff;padding:24px 18px;border-radius:0 0 24px 24px}
header h1{margin:0 0 6px;font-size:28px}
header p{margin:0;opacity:.9}
main{max-width:720px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #00000012}
h2{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:bold;font-size:13px}
input,select{width:100%;padding:12px;border:1px solid #ccd8cf;border-radius:10px;margin-top:6px;font-size:15px}
button{border:0;border-radius:10px;padding:12px 16px;background:#176b3a;color:#fff;font-weight:bold;cursor:pointer;margin-top:14px}
button.secondary{background:#e7efe9;color:#176b3a}
.event{border-left:5px solid #176b3a;padding:12px;background:#f7faf8;border-radius:10px;margin:10px 0}
.event strong{display:block;font-size:17px}
.meta{font-size:13px;color:#607064;margin-top:5px}
.actions button{margin:8px 6px 0 0;padding:8px 10px;font-size:12px}
.empty{color:#6d796f;text-align:center;padding:20px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>📚 Lecture Reminder</h1>
  <p>Never miss an upcoming lecture or event.</p>
</header>

<main>
  <div class="card">
    <h2>Add Lecture / Event</h2>

    <div class="grid">
      <div>
        <label for="title">Title</label>
        <input id="title" placeholder="e.g. CSC 401 Lecture">
      </div>

      <div>
        <label for="date">Date</label>
        <input id="date" type="date">
      </div>

      <div>
        <label for="time">Time</label>
        <input id="time" type="time">
      </div>

      <div>
        <label for="lead">Remind me</label>
        <select id="lead">
          <option value="0">At event time</option>
          <option value="5">5 minutes before</option>
          <option value="15" selected>15 minutes before</option>
          <option value="30">30 minutes before</option>
          <option value="60">1 hour before</option>
          <option value="1440">1 day before</option>
        </select>
      </div>
    </div>

    <label for="note" style="display:block;margin-top:12px">Venue / Note</label>
    <input id="note" placeholder="e.g. Room 204">

    <button onclick="addEvent()">Save Reminder</button>
    <button class="secondary" onclick="enableNotifications()">🔔 Enable Phone Notifications</button>
    <button class="secondary" onclick="sendTestNotification()">🧪 Send Test Notification</button>

    <p id="status" class="meta"></p>
    <p id="pushStatus" class="meta"></p>
  </div>

  <div class="card">
    <h2>Upcoming</h2>
    <div id="events"></div>
  </div>
</main>

<script src="/main.js"></script>
</body>
</html>
